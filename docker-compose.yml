services:
  cert-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./deploy/certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -s /certs/tls.crt ] || [ ! -s /certs/tls.key ]; then
          apk add --no-cache openssl >/dev/null &&
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 365
          -keyout /certs/tls.key -out /certs/tls.crt
          -subj '/CN=localhost'
          -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' &&
          chmod 600 /certs/tls.key;
        fi

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      DATASET_STORAGE_DIR: /app/data/uploads
      MAX_DATASET_FILE_SIZE: 10485760
      CORS_ORIGINS: https://localhost
    volumes:
      - dataset_uploads:/app/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./FE/FE-hoiquy3d
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
    expose: ["4000"]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  mongo_data:
  dataset_uploads:
